  const fallbackRates = { UGX: 3710, KES: 129, TZS: 2510, RWF: 1260, USD: 1 };
  const moneyFormatter = new Intl.NumberFormat('en-US', { maximumFractionDigits: 2 });

  const state = {
    activeTransactionType: 'transfer',
    exchangeRates: { ...fallbackRates }
  };

  const elements = {
    country: document.getElementById('country-select'),
    network: document.getElementById('network-select'),
    currencyAddon: document.getElementById('currency-addon'),
    amount: document.getElementById('amount-input'),
    transferButton: document.getElementById('type-transfer'),
    withdrawButton: document.getElementById('type-withdraw'),
    bracketInfo: document.getElementById('bracket-info'),
    breakdownBase: document.getElementById('breakdown-base'),
    breakdownFee: document.getElementById('breakdown-fee'),
    breakdownTax: document.getElementById('breakdown-tax'),
    breakdownTotal: document.getElementById('breakdown-total'),
    usdCrossContainer: document.getElementById('usd-cross-container'),
    usdCrossValue: document.getElementById('usd-cross-value'),
    exchangeBadge: document.getElementById('exchange-badge'),
    labelTax: document.getElementById('label-tax'),
    labelTotal: document.getElementById('label-total')
  };

  function formatValue(value) {
    return moneyFormatter.format(Number(value) || 0);
  }

  function setText(element, value) {
    if (element) element.textContent = value;
  }

  function debounce(fn, delay = 120) {
    let timeoutId;
    return (...args) => {
      clearTimeout(timeoutId);
      timeoutId = setTimeout(() => fn(...args), delay);
    };
  }

  function findTierMatch(tiers, amount) {
    if (!Array.isArray(tiers) || tiers.length === 0) return null;
    for (let i = 0; i < tiers.length; i += 1) {
      const tier = tiers[i];
      if (amount >= tier.min && amount <= tier.max) return tier;
    }
    return tiers[tiers.length - 1];
  }

  function populateNetworks() {
    const country = elements.country.value;
    const networks = Object.keys(countryData[country]?.networks || {});
    const fragment = document.createDocumentFragment();

    elements.network.innerHTML = '';
    networks.forEach((network) => {
      const option = document.createElement('option');
      option.value = network;
      option.textContent = network;
      fragment.appendChild(option);
    });

    elements.network.appendChild(fragment);
    const currency = countryData[country]?.currency || 'UGX';
    if (elements.currencyAddon) elements.currencyAddon.textContent = currency;
  }

  async function fetchExchangeRates() {
    const cacheKey = 'pan-african-momo-rates';
    const ttlMs = 60 * 60 * 1000;

    try {
      const cached = localStorage.getItem(cacheKey);
      if (cached) {
        const parsed = JSON.parse(cached);
        const age = Date.now() - parsed.timestamp;
        if (age < ttlMs) {
          state.exchangeRates = { ...fallbackRates, ...parsed.rates };
        }
      }
    } catch (error) {
      // Ignore cache issues gracefully.
    }

    try {
      const response = await fetch('https://open.er-api.com/v6/latest/USD');
      if (!response.ok) throw new Error('Exchange fetch failed');

      const data = await response.json();
      if (data?.rates) {
        state.exchangeRates = { ...fallbackRates, ...data.rates };

        try {
          localStorage.setItem(cacheKey, JSON.stringify({
            timestamp: Date.now(),
            rates: data.rates
          }));
        } catch (error) {
          // Ignore storage protection issues.
        }

        if (elements.exchangeBadge) elements.exchangeBadge.classList.remove('hidden');
      }
    } catch (error) {
      state.exchangeRates = { ...fallbackRates };
      if (elements.exchangeBadge) {
        elements.exchangeBadge.textContent = 'Using fallback FX rates';
        elements.exchangeBadge.classList.remove('hidden');
      }
    }
  }

  function renderUSDValue(amount, currency) {
    if (!elements.usdCrossContainer || !elements.usdCrossValue) return;

    if (state.exchangeRates[currency]) {
      const usdValue = amount / state.exchangeRates[currency];
      elements.usdCrossValue.textContent = `$${usdValue.toFixed(2)}`;
      elements.usdCrossContainer.classList.remove('hidden');
    } else {
      elements.usdCrossContainer.classList.add('hidden');
    }
  }

  function clearDisplay(currency) {
    setText(elements.bracketInfo, '');
    setText(elements.breakdownBase, `0.00 ${currency}`);
    setText(elements.breakdownFee, `0.00 ${currency}`);
    setText(elements.breakdownTax, `0.00 ${currency}`);
    setText(elements.breakdownTotal, `0.00 ${currency}`);
    elements.usdCrossContainer?.classList.add('hidden');
  }

  function setTransactionType(type, activeButton, inactiveButton) {
    state.activeTransactionType = type;

    activeButton.className = 'py-2.5 text-sm font-medium rounded-lg transition-all text-white bg-indigo-600 shadow-sm';
    inactiveButton.className = 'py-2.5 text-sm font-medium rounded-lg transition-all text-slate-600 hover:text-slate-900';

    if (type === 'transfer') {
      setText(elements.labelTax, 'Statutory Tax');
      setText(elements.labelTotal, 'Total Outlay Required');
    } else {
      setText(elements.labelTax, 'Excise Surcharge');
      setText(elements.labelTotal, 'Net Received Cash');
    }

    calculate();
  }

  function calculate() {
    const country = elements.country.value;
    const network = elements.network.value;
    const amount = Number.parseFloat(elements.amount.value) || 0;
    const currency = countryData[country]?.currency || 'UGX';

    if (!network || amount <= 0) {
      clearDisplay(currency);
      return;
    }

    const ruleConfig = countryData[country].networks[network];
    const tiers = state.activeTransactionType === 'transfer' ? ruleConfig.tiersTransfer : ruleConfig.tiersWithdraw;
    const matchedTier = findTierMatch(tiers, amount) || tiers[tiers.length - 1];
    const baseFee = matchedTier ? matchedTier.fee : 0;

    let tax = 0;
    let total = 0;

    if (state.activeTransactionType === 'transfer') {
      if (country === 'UG') {
        tax = amount * ruleConfig.taxRateTransfer;
      } else if (country === 'KE') {
        tax = baseFee * ruleConfig.taxRateTransfer;
      }
      total = amount + baseFee + tax;
    } else {
      if (country === 'KE') {
        tax = baseFee * ruleConfig.taxRateWithdraw;
      }
      total = amount - baseFee - tax;
    }

    setText(
      elements.bracketInfo,
      `Matched Tier Range: ${formatValue(matchedTier.min)} - ${formatValue(matchedTier.max)} ${currency}`
    );
    setText(elements.breakdownBase, `${formatValue(amount)} ${currency}`);
    setText(elements.breakdownFee, `${formatValue(baseFee)} ${currency}`);
    setText(elements.breakdownTax, `${formatValue(tax)} ${currency}`);
    setText(elements.breakdownTotal, `${formatValue(total)} ${currency}`);

    renderUSDValue(amount, currency);
  }

  function setupEventListeners() {
    elements.country.addEventListener('change', () => {
      populateNetworks();
      calculate();
    });

    elements.network.addEventListener('change', calculate);
    elements.amount.addEventListener('input', debounce(calculate, 120));

    elements.transferButton.addEventListener('click', () => {
      setTransactionType('transfer', elements.transferButton, elements.withdrawButton);
    });

    elements.withdrawButton.addEventListener('click', () => {
      setTransactionType('withdraw', elements.withdrawButton, elements.transferButton);
    });
  }

  async function init() {
    setupEventListeners();
    populateNetworks();
    await fetchExchangeRates();
    calculate();
  }

  document.addEventListener('DOMContentLoaded', init);
</script>
